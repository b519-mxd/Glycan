name: GlycoPath 1134 JATS literature audit
on:
  push:
    paths:
      - 'research/glycopath_harvest/**'
      - '.github/workflows/glycopath-1134-jats.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install secure JATS XML parser
        run: python -m pip install 'defusedxml>=0.7.1,<1'
      - name: Run collection (real Europe PMC API; no PDF)
        id: collect
        shell: bash
        run: |
          set +e
          python research/glycopath_harvest/collect_open_fulltext.py --target 1134 --output research/glycopath_harvest/results
          result=$?
          echo "collector_exit_code=$result" >> "$GITHUB_OUTPUT"
          exit "$result"
      - name: Publish results and strict gate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: glycopath-1134-metadata-and-licensing-audit
          path: research/glycopath_harvest/results/
          if-no-files-found: warn
          retention-days: 14
      - name: Status summary
        if: always()
        run: |
          if [ -e research/glycopath_harvest/results/summary.json ]; then
            cat research/glycopath_harvest/results/summary.json >> "$GITHUB_STEP_SUMMARY"
          else
            echo "BLOCKED: No summary produced" >> "$GITHUB_STEP_SUMMARY"
          fi
