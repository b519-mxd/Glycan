name: GlycoPath CPU weak-label pilot (NOT gold results)
on:
  workflow_dispatch:
  push:
    branches: ['glycopath/research-upgrade-*']
permissions:
  contents: read
  actions: read
jobs:
  weak-label-pilot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch original third-round archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p original_artifact
          gh run download 41441017494 --repo "$GITHUB_REPOSITORY" --name glycopath-1134-permissive-fulltext-and-audit --dir original_artifact
          cd original_artifact && zip -q -r ../original.zip .
      - run: python -m pip install scikit-learn joblib
      - name: Actually fit three CPU models on document-disjoint weak labels
        run: |
          PYTHONPATH=. python scripts/run_research.py weak-pilot --archive original.zip --output pilot_results
          python -c "import json;x=json.load(open('pilot_results/weak_pilot_metrics.json'));assert x['scientific_gold_metrics']=='NOT_AVAILABLE';assert len(x['scores'])==3"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: glycopath-weak-label-cpu-results-not-gold
          path: pilot_results/
          if-no-files-found: warn
