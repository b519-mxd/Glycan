[tool.poetry]
name = "glycan-immune-kg"
version = "0.1.0"
description = "End-to-end glycan morphology-immunity prediction and explainable evidence chain"
authors = ["Codex <codex@example.com>"]
readme = "README.md"
packages = [
  { include = "literature_retrieval" },
  { include = "information_extraction" },
  { include = "evidence_fusion" },
  { include = "knowledge_graph" },
  { include = "reasoning" },
  { include = "api" },
]

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
fastapi = "^0.115.0"
uvicorn = "^0.30.0"
pydantic = "^2.8.0"
pyyaml = "^6.0.1"
requests = "^2.32.3"
networkx = "^3.3"
python-dotenv = "^1.0.1"
neo4j = "^5.23.0"
numpy = "^2.0.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.2"
httpx = "^0.27.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
